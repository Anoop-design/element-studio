name: Validate native app and skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-and-skills:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check portable skills and mesh buffers
        run: python3 scripts/check_repository.py
      - name: Report native toolchain
        run: xcodebuild -version
      - name: Build and test on a dedicated iPhone simulator
        run: python3 scripts/test-native.py
      - name: Preserve native test results and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          path: |
            build/NativeTests-*.xcresult
            build/NativeTests-*.log
          if-no-files-found: warn
          retention-days: 7

name: Validate portable package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  authoring-and-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_repository.py
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Start local authoring server
        run: python3 -m http.server 8786 --bind 127.0.0.1 --directory Authoring > /tmp/element-studio-server.log 2>&1 &
      - run: npm run verify:browser

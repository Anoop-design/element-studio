name: ElementStudio
options:
  bundleIdPrefix: com.anoop
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  ElementStudio:
    type: application
    platform: iOS
    sources: [Sources, Resources, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anoop.elementstudio.dev
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Element Studio
        INFOPLIST_KEY_NSMotionUsageDescription: Tilt your iPhone to gently move elements while exploring the studio.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ElementStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ElementStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ElementStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ElementStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ElementStudio:
    build:
      targets:
        ElementStudio: all
    test:
      environmentVariables:
        STUDIO_REVIEW: "1"
      targets: [ElementStudioTests, ElementStudioUITests]
